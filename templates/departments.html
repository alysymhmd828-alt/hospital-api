<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأقسام - مستشفى العيسي</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="dashboard-body">
    
    <header class="topbar">
        <div class="topbar-right">
            <h1>🏥 مستشفى العيسي</h1>
            <span class="badge">الأقسام</span>
        </div>
        <div class="topbar-left">
            <span id="userInfo">مرحباً...</span>
            <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
        </div>
    </header>
    
    <main class="dashboard-main">
        
        <div class="page-header">
            <h2>🏢 قائمة الأقسام</h2>
            <div>
                <a href="/add_department_page" class="btn-primary">➕ إضافة قسم</a>
                <a href="/dashboard" class="btn-back">← العودة</a>
            </div>
        </div>
        
        <div id="message" class="message"></div>
        
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>اسم القسم</th>
                        <th>الوصف</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="departmentsBody">
                    <tr><td colspan="4" class="loading">⏳ جارٍ التحميل...</td></tr>
                </tbody>
            </table>
        </div>
        
    </main>
    
    <script src="/static/app.js"></script>
</body>
</html>
