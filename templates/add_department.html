<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة قسم - مستشفى العيسي</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="dashboard-body">
    
    <header class="topbar">
        <div class="topbar-right">
            <h1>🏥 مستشفى العيسي</h1>
            <span class="badge">إضافة قسم</span>
        </div>
        <div class="topbar-left">
            <span id="userInfo">مرحباً...</span>
            <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
        </div>
    </header>
    
    <main class="dashboard-main">
        
        <div class="page-header">
            <h2>➕ إضافة قسم جديد</h2>
            <a href="/departments_page" class="btn-back">← العودة</a>
        </div>
        
        <div class="form-container">
            <form id="addDepartmentForm">
                
                <div class="form-group">
                    <label for="name">اسم القسم *</label>
                    <input type="text" id="name" placeholder="مثال: القلب، العظام، الأطفال" required>
                </div>
                
                <div class="form-group">
                    <label for="description">الوصف (اختياري)</label>
                    <input type="text" id="description" placeholder="وصف مختصر للقسم">
                </div>
                
                <button type="submit" class="btn-login" id="submitBtn">حفظ القسم</button>
                
                <div id="message" class="message"></div>
                
            </form>
        </div>
        
    </main>
    
    <script src="/static/app.js"></script>
</body>
</html>
