<!DOCTYPE html>
<!-- ↑ HTML5 -->

<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - مستشفى العيسي</title>
    <link rel="stylesheet" href="/static/style.css">
    <!-- ↑ نفس ملف التصميم، سنضيف عليه لاحقاً -->
</head>

<body class="dashboard-body">
    <!-- ↑ class: لأجل تنسيق مختلف للوحة التحكم -->
    
    <!-- ═══ الشريط العلوي ═══ -->
    <header class="topbar">
        <div class="topbar-right">
            <h1>🏥 مستشفى العيسي</h1>
            <span class="badge">لوحة التحكم</span>
        </div>
        
        <div class="topbar-left">
            <span id="userInfo">مرحباً...</span>
            <!-- ↑ سي​عرض اسم المستخدم هنا -->
            
            <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
        </div>
    </header>
    
    <!-- ═══ المحتوى الرئيسي ═══ -->
    <main class="dashboard-main">
        
        <!-- بطاقات الإحصائيات -->
        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-info">
                    <h3 id="patientsCount">-</h3>
                    <p>المرضى</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">👨‍⚕️</div>
                <div class="stat-info">
                    <h3 id="doctorsCount">-</h3>
                    <p>الأطباء</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">🏢</div>
                <div class="stat-info">
                    <h3 id="departmentsCount">-</h3>
                    <p>الأقسام</p>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <div class="stat-info">
                    <h3 id="appointmentsCount">-</h3>
                    <p>المواعيد</p>
                </div>
            </div>
        </section>
        
        <!-- قسم الترحيب -->
        <section class="welcome-section">
            <h2>مرحباً بك في نظام إدارة المستشفى</h2>
            <p>اختر العملية التي تريد القيام بها:</p>
            
            <div class="actions-grid">
                <a href="#" class="action-btn">➕ إضافة مريض</a>
                <a href="#" class="action-btn">📋 عرض المرضى</a>
                <a href="#" class="action-btn">👨‍⚕️ إدارة الأطباء</a>
                <a href="#" class="action-btn">📅 المواعيد</a>
            </div>
        </section>
        
    </main>
    
    <script src="/static/app.js"></script>
</body>
</html>
