<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة موظف - مستشفى العيسي</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="dashboard-body">
    
    <header class="topbar">
        <div class="topbar-right">
            <h1>🏥 مستشفى العيسي</h1>
            <span class="badge">إضافة موظف</span>
        </div>
        <div class="topbar-left">
            <span id="userInfo">مرحباً...</span>
            <button id="logoutBtn" class="btn-logout">تسجيل الخروج</button>
        </div>
    </header>
    
    <main class="dashboard-main">
        
        <div class="page-header">
            <h2>➕ إضافة موظف جديد</h2>
            <a href="/employees_page" class="btn-back">← العودة</a>
        </div>
        
        <div class="form-container">
            <form id="addEmployeeForm">
                
                <div class="form-group">
                    <label for="name">اسم الموظف *</label>
                    <input type="text" id="name" placeholder="مثال: سالم أحمد" required>
                </div>
                
                <div class="form-group">
                    <label for="role">الوظيفة *</label>
                    <select id="role" required>
                        <option value="">-- اختر الوظيفة --</option>
                        <option value="ممرض">ممرض</option>
                        <option value="صيدلي">صيدلي</option>
                        <option value="حارس">حارس</option>
                        <option value="إداري">إداري</option>
                        <option value="فني مختبر">فني مختبر</option>
                        <option value="عامل نظافة">عامل نظافة</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="phone">رقم الهاتف</label>
                    <input type="text" id="phone" placeholder="مثال: 777123456">
                </div>
                
                <div class="form-group">
                    <label for="salary">الراتب</label>
                    <input type="number" id="salary" placeholder="مثال: 50000" min="0" step="1000">
                </div>
                
                <div class="form-group">
                    <label for="department_id">القسم (اختياري)</label>
                    <select id="department_id">
                        <option value="">-- بدون قسم --</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-login" id="submitBtn">حفظ الموظف</button>
                
                <div id="message" class="message"></div>
                
            </form>
        </div>
        
    </main>
    
    <script src="/static/app.js"></script>
</body>
</html>
